
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدیریت و نمایش محصولات</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,sans-serif;background:#f3f5f9;color:#202536}
header{background:#171d32;color:white;padding:25px 16px;text-align:center}
header h1{margin:0 0 10px}
nav{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}
button{border:0;border-radius:9px;padding:12px 18px;cursor:pointer;font-weight:bold;background:#34466e;color:white}
button:hover{opacity:.85}
main{max-width:1100px;margin:25px auto;padding:0 15px}
.panel{background:white;padding:20px;border-radius:15px;margin-bottom:20px;box-shadow:0 3px 15px #0000000c}
input,textarea{width:100%;padding:12px;margin:8px 0 14px;border:1px solid #d8dce5;border-radius:8px;font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.item{background:white;border-radius:13px;overflow:hidden;box-shadow:0 3px 12px #00000012}
.item img{width:100%;height:190px;object-fit:cover;background:#e8eaf0}
.info{padding:15px}
.price{color:#16845b;font-weight:bold}
.danger{background:#b52e3b}
.hidden{display:none}
footer{text-align:center;padding:25px;color:#777}
</style>
</head>
<body>
<header>
<h1 id="siteTitle">فروشگاه و گالری من</h1>
<p>نمایش محصولات، تصاویر و قیمت‌ها</p>
<nav>
<button onclick="showHome()">صفحه اصلی</button>
<button onclick="login()">ورود مدیر</button>
</nav>
</header>

<main>
<section id="home">
<h2>محصولات و تصاویر</h2>
<div class="grid" id="products"></div>
</section>

<section id="admin" class="hidden">
<div class="panel">
<h2>پنل مدیریت</h2>
<label>عنوان سایت</label>
<input id="titleInput" placeholder="عنوان جدید سایت">
<button onclick="changeTitle()">تغییر عنوان</button>
</div>

<div class="panel">
<h2>افزودن محصول یا تصویر</h2>
<label>نام محصول</label>
<input id="name" placeholder="نام محصول">
<label>قیمت</label>
<input id="price" placeholder="قیمت محصول">
<label>توضیحات</label>
<textarea id="description" placeholder="توضیحات محصول"></textarea>
<label>انتخاب تصویر</label>
<input id="photo" type="file" accept="image/*">
<button onclick="addProduct()">افزودن به سایت</button>
</div>

<div class="panel">
<h2>مدیریت محصولات</h2>
<div id="manage"></div>
</div>
</section>
</main>

<footer>طراحی و مدیریت سایت</footer>

<script>
const PASSWORD="123456";
let products=JSON.parse(localStorage.getItem("myProducts")||"[]");
let title=localStorage.getItem("myTitle")||"فروشگاه و گالری من";

function save(){
localStorage.setItem("myProducts",JSON.stringify(products));
localStorage.setItem("myTitle",title);
}
function render(){
document.getElementById("siteTitle").textContent=title;
document.getElementById("titleInput").value=title;
document.getElementById("products").innerHTML=products.map((p,i)=>`
<div class="item">
<img src="${p.image}" alt="">
<div class="info">
<h3>${escapeHTML(p.name)}</h3>
<p>${escapeHTML(p.description)}</p>
<div class="price">${escapeHTML(p.price)}</div>
</div></div>`).join("");
document.getElementById("manage").innerHTML=products.map((p,i)=>`
<p>${escapeHTML(p.name)} <button class="danger" onclick="removeProduct(${i})">حذف</button></p>`).join("");
}
function escapeHTML(s){
return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function showHome(){
document.getElementById("home").classList.remove("hidden");
document.getElementById("admin").classList.add("hidden");
}
function login(){
let pass=prompt("رمز ورود مدیر را وارد کنید:");
if(pass===PASSWORD){
document.getElementById("home").classList.add("hidden");
document.getElementById("admin").classList.remove("hidden");
render();
}else if(pass!==null){alert("رمز اشتباه است");}
}
function changeTitle(){
title=document.getElementById("titleInput").value.trim()||title;
save();render();alert("عنوان تغییر کرد");
}
function addProduct(){
let file=document.getElementById("photo").files[0];
if(!file){alert("لطفاً تصویر انتخاب کنید");return;}
if(file.size>2*1024*1024){alert("حجم تصویر باید کمتر از ۲ مگابایت باشد");return;}
let reader=new FileReader();
reader.onload=()=>{
products.push({
name:document.getElementById("name").value,
price:document.getElementById("price").value,
description:document.getElementById("description").value,
image:reader.result
});
try{save();render();alert("محصول اضافه شد");}
catch(e){alert("فضای ذخیره‌سازی مرورگر کافی نیست");}
};
reader.readAsDataURL(file);
}
function removeProduct(i){
if(confirm("این محصول حذف شود؟")){
products.splice(i,1);save();render();
}
}
render();
</script>
</body>
  </html>
